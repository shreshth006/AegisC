[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisc"
version = "0.1.0"
description = "A teachable compiler with stage visualization, an LLM tutor, and compiler-enforced computational budgets for untrusted input"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aegisc = "aegisc.cli:main"

[tool.setuptools.packages.find]
include = ["aegisc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
